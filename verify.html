<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>শিক্ষার্থী আইডি কার্ড - মাদরাসা ভেরিফিকেশন সিস্টেম</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
  
  <style>
    @font-face {
      font-family: 'Qayyum Book';
      src: url('ফন্ট/Qayyum Book.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'JunudullahZami';
      src: url('ফন্ট/FN Junudullah Zami.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Sheikh Hasina';
      src: url('ফন্ট/Li Sheikh Hasina 2 Unicode.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Bornomala';
      src: url('ফন্ট/Bornomala-Regular.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Ador Noirrit';
      src: url('ফন্ট/Li Ador Noirrit A-V2 Light.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --danger: #dc2626;
      --danger-dark: #991b1b;
      --gray-50: #fafafa;
      --gray-100: #f4f4f5;
      --gray-200: #e4e4e7;
      --gray-300: #d4d4d8;
      --gray-400: #a1a1aa;
      --gray-500: #71717a;
      --gray-600: #52525b;
      --gray-700: #3f4646;
      --gray-800: #27272a;
      --gray-900: #18181b;
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
      --shadow-hover: 0 1px 3px rgba(0,0,0,0.06), 0 12px 40px rgba(0,0,0,0.06);
      --radius: 12px;
      --transition: all 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeScale {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--gray-50);
      font-family: 'Kalpurush', 'Qayyum Book', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--gray-900);
    }

    .main-container {
      width: 100%;
      max-width: 840px;
      animation: fadeUp 0.4s ease;
    }

    /* ===== Overlay ===== */
    .status-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    .status-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .status-overlay.warning {
      background: rgba(153,27,27,0.65);
    }
    .overlay-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 56px;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      animation: fadeScale 0.3s ease;
      max-width: 580px;
      width: 90%;
    }
    .overlay-main {
      font-family: 'Sheikh Hasina', serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      color: #fff;
      display: block;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 14px;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    .overlay-sub {
      font-family: 'Bornomala', sans-serif;
      font-size: clamp(1.1rem, 2.5vw, 1.8rem);
      color: #fcd34d;
      display: block;
    }
    .overlay-sub.warning-sub {
      color: #fca5a5;
      animation: pulse 1.5s infinite;
    }

    /* ===== Header ===== */
    .header {
      background: #fff;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 24px 28px 18px;
      text-align: center;
      border-bottom: 1px solid var(--gray-200);
      box-shadow: var(--shadow);
    }
    .logo {
      max-width: 150px;
      height: auto;
      margin-bottom: 6px;
    }
    .header-title {
      font-family: 'JunudullahZami', serif;
      font-size: clamp(20px, 3.5vw, 26px);
      color: var(--gray-900);
    }
    .header-sub {
      font-size: 14px;
      color: var(--gray-500);
      margin-top: 2px;
    }
    .year-badge {
      display: inline-block;
      background: var(--gray-100);
      color: var(--gray-600);
      padding: 5px 24px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 500;
      margin-top: 8px;
    }

    /* ===== Main Card ===== */
    .student-card {
      background: #fff;
      border-radius: 0 0 var(--radius) var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--gray-200);
      border-top: none;
    }

    /* ===== Profile ===== */
    .profile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      background: var(--gray-50);
      border-radius: var(--radius);
      margin-bottom: 24px;
      border: 1px solid var(--gray-200);
    }
    .profile-name {
      font-family: 'Sheikh Hasina', serif;
      font-size: clamp(22px, 4vw, 32px);
      color: var(--gray-900);
      line-height: 1.2;
    }
    .profile-id {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--gray-500);
      background: #fff;
      padding: 3px 16px;
      border-radius: 100px;
      border: 1px solid var(--gray-200);
    }
    .profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: var(--gray-500);
      flex-shrink: 0;
    }

    /* ===== Info Grid ===== */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--gray-50);
      border-radius: 8px;
      border: 1px solid var(--gray-100);
      transition: var(--transition);
    }
    .item:hover {
      background: #fff;
      border-color: var(--gray-200);
    }
    .item.full {
      grid-column: 1 / -1;
    }
    .item-icon {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-500);
      font-size: 14px;
      flex-shrink: 0;
      border: 1px solid var(--gray-200);
    }
    .item-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--gray-400);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: block;
    }
    .item-value {
      font-size: 15px;
      color: var(--gray-900);
      font-weight: 500;
    }
    .item-value.empty {
      color: var(--gray-300);
      font-weight: 400;
      font-style: italic;
    }

    /* ===== Blood Group Badge ===== */
    .blood-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fef2f2;
      color: var(--danger);
      padding: 2px 14px 2px 10px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #fecaca;
    }
    .blood-badge i {
      font-size: 13px;
    }
    .blood-badge .label {
      font-weight: 400;
      color: var(--gray-500);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* ===== Status Badge ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge.success { background: #dcfce7; color: #166534; }
    .badge.warning { background: #fef3c7; color: #92400e; }
    .badge.danger { background: #fee2e2; color: #991b1b; }
    .badge.info { background: #dbeafe; color: #1e40af; }
    .badge i { font-size: 10px; }

    /* ===== Blocked ===== */
    .blocked {
      text-align: center;
      padding: 48px 24px;
      background: #fef2f2;
      border-radius: var(--radius);
      border: 1px solid #fecaca;
    }
    .blocked-icon {
      font-size: 64px;
      display: block;
      margin-bottom: 16px;
    }
    .blocked-title {
      font-family: 'Sheikh Hasina', serif;
      font-size: clamp(28px, 5vw, 38px);
      color: var(--danger-dark);
    }
    .blocked-sub {
      font-size: clamp(16px, 3vw, 20px);
      color: var(--danger);
      margin: 4px 0 16px;
    }
    .blocked-msg {
      background: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      display: inline-block;
      font-size: 14px;
      color: var(--gray-600);
      border-left: 3px solid var(--danger);
    }

    /* ===== Not Found ===== */
    .not-found {
      text-align: center;
      padding: 40px 24px;
      background: #fffbeb;
      border-radius: var(--radius);
      border: 1px solid #fde68a;
    }
    .not-found i {
      font-size: 56px;
      color: #d97706;
      margin-bottom: 12px;
    }
    .not-found h2 {
      font-size: 24px;
      color: #92400e;
    }
    .not-found p {
      color: var(--gray-600);
      margin-top: 4px;
    }
    .not-found .sub {
      font-size: 13px;
      color: var(--gray-400);
      margin-top: 8px;
    }

    /* ===== Home Link ===== */
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gray-500);
      padding: 10px 24px;
      border-radius: 100px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      border: 1px solid var(--gray-200);
      transition: var(--transition);
      margin-top: 16px;
      background: #fff;
    }
    .home-link:hover {
      border-color: var(--gray-300);
      color: var(--gray-900);
      background: var(--gray-50);
    }

    /* ===== Floating Home ===== */
    .floating-home {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #fff;
      color: var(--gray-600);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 20px;
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow);
      transition: var(--transition);
      z-index: 999;
    }
    .floating-home:hover {
      border-color: var(--gray-300);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    /* ===== Mobile Bottom Bar ===== */
    .bottom-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      padding: 6px 0 10px;
      border-top: 1px solid var(--gray-200);
      z-index: 1000;
      justify-content: space-around;
      align-items: center;
    }
    .bottom-bar a {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--gray-400);
      font-size: 10px;
      font-weight: 500;
      gap: 2px;
      transition: var(--transition);
    }
    .bottom-bar a i {
      font-size: 18px;
      color: var(--gray-400);
    }
    .bottom-bar a:hover {
      color: var(--gray-600);
    }
    .bottom-bar a:hover i {
      color: var(--gray-600);
    }

    /* ===== Loading ===== */
    .loading {
      text-align: center;
      padding: 32px 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--gray-200);
      border-top-color: var(--gray-600);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    .loading p {
      color: var(--gray-400);
      font-size: 14px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      body { padding: 12px; }
      .header { padding: 18px 16px 14px; }
      .student-card { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
      .profile {
        flex-direction: column;
        text-align: center;
        padding: 16px;
        gap: 12px;
      }
      .profile-avatar { width: 48px; height: 48px; font-size: 22px; }
      .item { padding: 10px 14px; }
      .floating-home { display: none; }
      .bottom-bar { display: flex; }
      .overlay-card { padding: 28px 20px; }
    }

    @media (min-width: 769px) {
      .bottom-bar { display: none; }
      .floating-home { display: flex; }
    }

    @media (max-width: 480px) {
      .profile-name { font-size: 20px; }
      .item-value { font-size: 14px; }
      .item { padding: 8px 12px; gap: 10px; }
      .item-icon { width: 26px; height: 26px; font-size: 12px; }
    }
  </style>
</head>
<body>

  </div>

  <script>
    (function() {
      const SUPABASE_URL = 'https://fhgnqvyibgobdswqrgpe.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ25xdnlpYmdvYmRzd3FyZ3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NjAzMzMsImV4cCI6MjEwODAzNjMzM30.EMPgvqFKx3UUDFcTbhgzw4AE04QuFukIiQchf2wFK6I';

      const params = new URLSearchParams(window.location.search);
      const yearParam = (params.get('year') || '').trim();
      const jamatParam = (params.get('jamat') || '').trim();
      const regRaw = (params.get('reg') || '').trim();
      const rollRaw = (params.get('roll') || '').trim();

      const overlay = document.getElementById('statusOverlay');
      const overlayMain = document.getElementById('overlayMain');
      const overlaySub = document.getElementById('overlaySub');
      const infoDiv = document.getElementById('studentInfo');
      const yearDiv = document.getElementById('yearDisplay');

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      function bnToEnNumber(str) {
        if (str === null || str === undefined) return '';
        const bn = '০১২৩৪৫৬৭৮৯';
        const en = '0123456789';
        return String(str).replace(/[০-৯]/g, function(d) {
          return en[bn.indexOf(d)];
        });
      }

      function enToBnNumber(str) {
        if (str === null || str === undefined) return '';
        const bn = '০১২৩৪৫৬৭৮৯';
        const en = '0123456789';
        return String(str).replace(/[0-9]/g, function(d) {
          return bn[en.indexOf(d)];
        });
      }

      function normalizeBengaliText(str) {
        return String(str || '')
          .replace(/\u09AF\u09BC/g, 'য়')
          .replace(/\u09A1\u09BC/g, 'ড়')
          .replace(/\u09A2\u09BC/g, 'ঢ়')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function normalizeRegToken(val) {
        if (val === null || val === undefined) return '';
        const base = bnToEnNumber(String(val)).split('__ay_')[0].trim();
        const digitsOnly = base.replace(/^0+/, '');
        return digitsOnly || base;
      }

      function getCanonicalJamatId(raw) {
        const str = normalizeBengaliText(raw);
        if (!str) return '';
        const clean = str.replace(/\s*\([^)]*তালিকায় নেই\)/g, '').trim();
        if (clean === 'এ' || clean.toLowerCase() === 'a' || clean === 'এ শ্রেণি' || clean === 'এ জামাত') {
          return 'class-9';
        }
        const norm = clean.toLowerCase();

        if (norm.includes('দাওরা') || norm.includes('তাকমিল') || norm.includes('তাকমীল')) return 'class-13';
        if (norm.includes('মেশকাত') || norm.includes('মিশকাত') || norm.includes('ফযীলাত ছানী') || norm.includes('ফজিলত ছানী')) return 'class-12';
        if (((norm.includes('হেদায়া') || norm.includes('হেদায়েত')) && !norm.includes('হেদায়াতুন্নাহু') && !norm.includes('হেদায়েতুন্নাহু')) || norm.includes('জালালাইন') || norm.includes('ফযীলাত আওয়াল') || norm.includes('ফজিলত আওয়াল')) return 'class-11';
        if (norm.includes('বেকায়া') || norm.includes('বেকায়া') || norm.includes('সানাবিয্যা ছানী') || norm.includes('সানাবিয়্যা ছানী') || norm.includes('সানাবিয়া উলিয়া') || norm.includes('সানাবিয়া উলিয়া')) return 'class-10';
        if (norm.includes('কুদূরী') || norm.includes('কুদ্দুরী') || norm.includes('হেদায়াতুন্নাহু') || norm.includes('হেদায়েতুন্নাহু') || norm.includes('সানাবিয্যা আউয়াল') || norm.includes('সানাবিয়্যা আউয়াল') || norm.includes('সানাবিয়া আম্মাহ') || norm.includes('সানাবিয়া আম্মাহ')) return 'class-9';
        if (norm.includes('নাহবেমীর') || norm.includes('নাহবে মীর') || norm.includes('মুতাওয়াসসিতাহ ছানী') || norm.includes('মুতাওয়াসসিতাহ ছানি') || norm.includes('মুতাওয়াসসিতাহ ছানী') || norm.includes('মুতাওয়াসসিতাহ ছানি')) return 'class-8';
        if (norm.includes('মিযান') || norm.includes('মিয়ান') || norm.includes('মুতাওয়াসসিতাহ আওয়াল') || norm.includes('মুতাওয়াসসিতাহ আউয়াল') || norm.includes('মুতাওয়াসসিতাহ আওয়াল') || norm.includes('মুতাওয়াসসিতাহ আউয়াল')) return 'class-7';
        if (norm.includes('খামেছ') || norm.includes('খামেস') || norm.includes('খামিস') || norm.includes('৫ম') || norm.includes('পঞ্চম')) return 'class-6';
        if (norm.includes('রাবে') || norm.includes('৪র্থ') || norm.includes('চতুর্থ')) return 'class-5';
        if (norm.includes('ছালেছ') || norm.includes('ছালেস') || norm.includes('সালেস') || norm.includes('৩য়') || norm.includes('তৃতীয়')) return 'class-4';
        if (norm.includes('ছানী') || norm.includes('ছানি') || norm.includes('সানী') || norm.includes('২য়') || norm.includes('দ্বিতীয়')) return 'class-3';
        if (norm.includes('আওয়াল') || norm.includes('আউয়াল') || norm.includes('১ম') || norm.includes('প্রথম')) return 'class-2';
        if (norm.includes('রওজা') || norm.includes('াতফাল') || norm.includes('শিশু')) return 'class-1';
        if (norm.includes('হিফজ') || norm.includes('হিফয')) return 'hifz';
        if (norm.includes('নাযেরা') || norm.includes('নাজেরা')) return 'nazera';
        if (norm.includes('নূরানী') || norm.includes('নুরানী')) return 'noorani';

        return norm;
      }

      function isJamatMatch(row, targetJamat) {
        if (!targetJamat) return true;
        const extra = (row && row.additional_fields) || {};
        const candidates = [
          row.jamat_name,
          row.full_jamat_name,
          extra['জামাত'],
          extra['জামাত/শ্রেণী'],
          extra['পূর্ণ জামাতের নাম'],
          extra['পূর্ণ জামাত'],
          extra.class
        ].filter(Boolean);

        const targetNorm = normalizeBengaliText(targetJamat);
        const targetCanonical = getCanonicalJamatId(targetNorm);

        for (let i = 0; i < candidates.length; i++) {
          const candNorm = normalizeBengaliText(candidates[i]);
          if (!candNorm) continue;
          if (candNorm === targetNorm || candNorm.toLowerCase() === targetNorm.toLowerCase()) {
            return true;
          }
          const candCanonical = getCanonicalJamatId(candNorm);
          if (candCanonical && targetCanonical && candCanonical === targetCanonical) {
            return true;
          }
          if (candNorm.includes(targetNorm) || targetNorm.includes(candNorm)) {
            return true;
          }
        }
        return false;
      }

      function isYearMatch(row, targetYear) {
        if (!targetYear) return true;
        const extra = (row && row.additional_fields) || {};
        const rowYear = normalizeBengaliText(row.academic_year_title || extra['শিক্ষাবর্ষ'] || extra.academicYearLabel || '');
        if (!rowYear) return false;

        const uClean = bnToEnNumber(normalizeBengaliText(targetYear)).replace(/\s+/g, '').toLowerCase();
        const rClean = bnToEnNumber(rowYear).replace(/\s+/g, '').toLowerCase();

        if (uClean === rClean || rClean.includes(uClean) || uClean.includes(rClean)) {
          return true;
        }

        // Check Hijri year match (e.g. 1445, 1446, 1447, 1448)
        const uHijri = uClean.match(/(14\d{2})/);
        const rHijri = rClean.match(/(14\d{2})/);
        if (uHijri && rHijri) {
          return uHijri[1] === rHijri[1];
        }

        // Fallback: Gregorian session starting year
        const uGreg = uClean.match(/(20\d{2})/);
        const rGreg = rClean.match(/(20\d{2})/);
        if (uGreg && rGreg) {
          return uGreg[1] === rGreg[1];
        }

        return false;
      }

      function isRegMatch(row, targetRegClean) {
        if (!targetRegClean) return false;
        const extra = (row && row.additional_fields) || {};
        const candidates = [
          row.registration_no,
          row.legacy_id,
          row.student_id,
          extra['রেজিস্ট্রেশন/আইডি নম্বর'],
          extra['রেজিস্ট্রেশন/আইডি'],
          extra.id
        ];
        for (let i = 0; i < candidates.length; i++) {
          if (normalizeRegToken(candidates[i]) === targetRegClean) {
            return true;
          }
        }
        return false;
      }

      function formatDobDisplay(rawDob) {
        if (!rawDob) return '';
        const clean = String(rawDob).trim();
        const isoMatch = clean.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (isoMatch) {
          return isoMatch[3] + '/' + isoMatch[2] + '/' + isoMatch[1];
        }
        return clean;
      }

      const regClean = normalizeRegToken(regRaw);
      const rollClean = rollRaw ? normalizeRegToken(rollRaw) : '';

      if (!yearParam || !jamatParam || !regClean) {
        infoDiv.innerHTML = `
          <div class="not-found">
            <i class="fas fa-exclamation-triangle"></i>
            <h2>সঠিক তথ্য দিন</h2>
            <p>year, jamat, reg প্রয়োজন</p>
            <div class="sub">roll নম্বর ঐচ্ছিক</div>
          </div>
        `;
        yearDiv.innerHTML = 'শিক্ষাবর্ষ: পাওয়া যায়নি';
        overlay.classList.remove('active', 'warning');
        return;
      }

      yearDiv.innerHTML = `শিক্ষাবর্ষ: ${escapeHtml(yearParam)}`;

      async function querySupabaseStudents(queryString) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/students?${queryString}`, {
          method: 'GET',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Accept': 'application/json'
          }
        });
        if (!res.ok) {
          throw new Error('Supabase fetch failed: ' + res.status);
        }
        return res.json();
      }

      async function findMatchingStudent() {
        const regEn = bnToEnNumber(regRaw).trim();
        const regBn = enToBnNumber(regEn);
        const legacyAutoPattern = regEn + '__ay_*';

        // 1. Direct indexed query for this registration / legacy / student ID
        const orFilter = [
          `registration_no.eq.${regEn}`,
          `registration_no.eq.${regBn}`,
          `legacy_id.eq.${regEn}`,
          `legacy_id.eq.${regBn}`,
          `legacy_id.like.${legacyAutoPattern}`,
          `student_id.eq.${regEn}`,
          `student_id.eq.${regBn}`
        ].map(part => encodeURIComponent(part)).join(',');

        let candidates = await querySupabaseStudents(
          `select=*&is_deleted=eq.false&or=(${orFilter})`
        );

        // 2. Fallback partial match if needed (e.g., leading zeros or whitespace)
        if (!Array.isArray(candidates) || candidates.length === 0) {
          const likeFilter = [
            `registration_no.ilike.*${regClean}*`,
            `legacy_id.ilike.*${regClean}*`
          ].map(part => encodeURIComponent(part)).join(',');
          candidates = await querySupabaseStudents(
            `select=*&is_deleted=eq.false&or=(${likeFilter})`
          );
        }

        if (!Array.isArray(candidates) || candidates.length === 0) {
          return null;
        }

        // Strict filtering: reg + year + jamat
        const regMatched = candidates.filter(r => isRegMatch(r, regClean));
        if (regMatched.length === 0) return null;

        const yearMatched = regMatched.filter(r => isYearMatch(r, yearParam));
        const yearAndJamat = yearMatched.filter(r => isJamatMatch(r, jamatParam));
        if (yearAndJamat.length > 0) return yearAndJamat[0];

        // If year matched and only one student exists for that reg in that year
        if (yearMatched.length === 1) return yearMatched[0];

        // Fallback if row had empty academic_year_title in DB
        const emptyYearJamat = regMatched.filter(r => !r.academic_year_title && isJamatMatch(r, jamatParam));
        if (emptyYearJamat.length > 0) return emptyYearJamat[0];

        return null;
      }

      findMatchingStudent()
        .then(row => {
          if (!row) {
            infoDiv.innerHTML = `
              <div class="not-found">
                <i class="fas fa-search"></i>
                <h2>শিক্ষার্থী পাওয়া যায়নি</h2>
                <p>${escapeHtml(yearParam)}</p>
                <p style="margin-top:8px;">জামাত: ${escapeHtml(jamatParam)}<br>রেজি: ${escapeHtml(regRaw)}</p>
                ${rollRaw ? `<div class="sub">রোল: ${escapeHtml(rollRaw)} (ঐচ্ছিক)</div>` : ''}
              </div>
            `;
            overlay.classList.remove('active', 'warning');
            return;
          }

          const extra = row.additional_fields || {};
          const displayYear = row.academic_year_title || extra['শিক্ষাবর্ষ'] || yearParam;
          yearDiv.innerHTML = `শিক্ষাবর্ষ: ${escapeHtml(displayYear)}`;

          const studentName = row.student_name_bn || extra['শিক্ষার্থীর নাম'] || extra.name || '';
          const studentReg = row.registration_no || (row.legacy_id ? String(row.legacy_id).split('__ay_')[0] : '') || row.student_id || extra['রেজিস্ট্রেশন/আইডি নম্বর'] || extra['রেজিস্ট্রেশন/আইডি'] || '';
          const studentRoll = row.roll_no || extra['রোল নম্বর'] || extra.roll || '';
          const fatherName = row.father_name_bn || extra['পিতার নাম'] || extra.fatherName || '';
          const marhalaName = row.marhala_name || row.marhala_stage || extra['মারহালা'] || extra.marhala || '';
          const jamatName = row.full_jamat_name || row.jamat_name || extra['জামাত/শ্রেণী'] || extra['জামাত'] || '';
          const somoman = row.somoman || extra['সমমান'] || '';
          const phoneMother = row.phone_mother || extra['মোবাইল (মা)'] || row.guardian_phone || extra['অভিভাবকের মোবাইল'] || extra.mobile || '';
          const phoneFatherBrother = row.phone_father_brother || extra['মোবাইল (বাবা/ভাই)'] || row.alt_phone || extra['২য় মোবাইল'] || extra['বিকল্প মোবাইল'] || extra.altMobile || '';
          const birthReg = row.birth_reg_no || extra['জন্ম নিবন্ধন নাম্বার'] || extra['জন্ম নিবন্ধন নম্বর'] || extra['জন্ম নিবন্ধন/NID নং'] || extra.birthReg || '';
          const dob = formatDobDisplay(row.dob_raw || row.birth_date || extra['জন্ম তারিখ'] || extra.dob || '');
          const address = row.full_address || extra['ঠিকানা'] || extra['স্থায়ী ঠিকানা'] || extra.address || '';
          const blood = row.blood_group || extra['রক্তের গ্রুপ'] || extra.bloodGroup || '';
          const rawStatus = String(row.status || extra['শিক্ষার্থী ধরণ/স্ট্যাটাস'] || extra['স্ট্যাটাস'] || '').trim();
          const status = rawStatus.toLowerCase() === 'active' ? 'সক্রিয়' : rawStatus;

          const getBadgeClass = (st) => {
            if (!st) return 'info';
            if (st.includes('ত্যাগকৃত') || st.includes('বহিষ্কৃত') || st.includes('বাতিল')) return 'danger';
            if (st.includes('অধ্যয়নরত') || st.includes('অধ্যয়নরত') || st.includes('সক্রিয়') || st.includes('সক্রিয়') || st.toLowerCase() === 'active') return 'success';
            if (st.includes('অপেক্ষমাণ') || st.includes('স্থগিত')) return 'warning';
            return 'info';
          };

          const getBadgeIcon = (st) => {
            if (!st) return 'fa-circle-info';
            if (st.includes('ত্যাগকৃত') || st.includes('বহিষ্কৃত') || st.includes('বাতিল')) return 'fa-circle-exclamation';
            if (st.includes('অধ্যয়নরত') || st.includes('অধ্যয়নরত') || st.includes('সক্রিয়') || st.includes('সক্রিয়') || st.toLowerCase() === 'active') return 'fa-circle-check';
            if (st.includes('অপেক্ষমাণ') || st.includes('স্থগিত')) return 'fa-clock';
            return 'fa-circle-info';
          };

          const bloodHTML = (blood && blood !== 'জানা নেই') ? `
            <span class="blood-badge">
              <i class="fas fa-droplet"></i>
              <span class="label">রক্তের গ্রুপ</span>
              ${escapeHtml(blood)}
            </span>
          ` : `<span class="item-value empty">${blood ? escapeHtml(blood) : 'উল্লেখ নেই'}</span>`;

          const eqHTML = somoman ? escapeHtml(somoman) : `<span class="item-value empty">উল্লেখ নেই</span>`;
          const statusLabel = status ? status.split(/[-–—]/)[0].trim() : '';

          const fullHTML = `
            <div class="profile">
              <div>
                <div class="profile-name">${escapeHtml(studentName || 'উল্লেখ নেই')}</div>
                <div class="profile-id">
                  <i class="fas fa-qrcode"></i>
                  ${escapeHtml(studentReg || 'N/A')}
                </div>
              </div>
              <div class="profile-avatar">
                <i class="fas fa-user-graduate"></i>
              </div>
            </div>

            <div class="grid">
              <div class="item">
                <div class="item-icon"><i class="fas fa-id-card"></i></div>
                <div>
                  <span class="item-label">রেজিস্ট্রেশন</span>
                  <div class="item-value">${escapeHtml(studentReg || 'উল্লেখ নেই')}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-sort-numeric-up"></i></div>
                <div>
                  <span class="item-label">রোল নম্বর</span>
                  <div class="item-value">${escapeHtml(studentRoll || 'উল্লেখ নেই')}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-user-tie"></i></div>
                <div>
                  <span class="item-label">পিতার নাম</span>
                  <div class="item-value">${escapeHtml(fatherName || 'উল্লেখ নেই')}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-graduation-cap"></i></div>
                <div>
                  <span class="item-label">মারহালা</span>
                  <div class="item-value">${escapeHtml(marhalaName || 'উল্লেখ নেই')}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-users"></i></div>
                <div>
                  <span class="item-label">জামাত/শ্রেণী</span>
                  <div class="item-value">${escapeHtml(jamatName || 'উল্লেখ নেই')}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-tag"></i></div>
                <div>
                  <span class="item-label">সমমান</span>
                  <div class="item-value">${eqHTML}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-phone"></i></div>
                <div>
                  <span class="item-label">মোবাইল (মা/বোন)</span>
                  <div class="item-value">${escapeHtml(phoneMother || 'উল্লেখ নেই')}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-phone"></i></div>
                <div>
                  <span class="item-label">মোবাইল (বাবা/ভাই)</span>
                  <div class="item-value">${escapeHtml(phoneFatherBrother || 'উল্লেখ নেই')}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-calendar-alt"></i></div>
                <div>
                  <span class="item-label">জন্ম নিবন্ধন</span>
                  <div class="item-value">${escapeHtml(birthReg || 'উল্লেখ নেই')}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-cake-candles"></i></div>
                <div>
                  <span class="item-label">জন্ম তারিখ</span>
                  <div class="item-value">${escapeHtml(dob || 'উল্লেখ নেই')}</div>
                </div>
              </div>

              <div class="item full">
                <div class="item-icon"><i class="fas fa-map-pin"></i></div>
                <div>
                  <span class="item-label">ঠিকানা</span>
                  <div class="item-value">${escapeHtml(address || 'উল্লেখ নেই')}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-droplet"></i></div>
                <div>
                  <span class="item-label">রক্তের গ্রুপ</span>
                  <div class="item-value">${bloodHTML}</div>
                </div>
              </div>

              <div class="item">
                <div class="item-icon"><i class="fas fa-info-circle"></i></div>
                <div>
                  <span class="item-label">শিক্ষার্থী ধরণ</span>
                  <div class="item-value">
                    ${escapeHtml(status || 'উল্লেখ নেই')}
                    ${status ? ` <span class="badge ${getBadgeClass(status)}"><i class="fas ${getBadgeIcon(status)}"></i> ${escapeHtml(statusLabel)}</span>` : ''}
                  </div>
                </div>
              </div>
            </div>
          `;

          // Overlay
          let mainStatus = status;
          let subStatus = '';
          if (status.includes('–')) { let parts = status.split('–'); mainStatus = parts[0].trim(); subStatus = parts[1] ? parts[1].trim() : ''; }
          else if (status.includes('—')) { let parts = status.split('—'); mainStatus = parts[0].trim(); subStatus = parts[1] ? parts[1].trim() : ''; }
          else if (status.includes('-')) { let parts = status.split('-'); mainStatus = parts[0].trim(); subStatus = parts[1] ? parts[1].trim() : ''; }
          if (status.includes('সাময়িক ভর্তি বাতিল')) { mainStatus = 'সাময়িক ভর্তি বাতিল'; subStatus = ''; }
          else if (status.includes('পূর্ণ ভর্তি বাতিল')) { mainStatus = 'পূর্ণ ভর্তি বাতিল'; subStatus = ''; }

          overlayMain.innerText = mainStatus || 'স্ট্যাটাস';
          overlaySub.innerText = subStatus || '';
          const isWarning = status.includes('ত্যাগকৃত') || status.includes('বহিষ্কৃত') || status.includes('বাতিল');
          overlay.classList.add('active');
          if (isWarning) {
            overlay.classList.add('warning');
            overlaySub.classList.add('warning-sub');
          } else {
            overlay.classList.remove('warning');
            overlaySub.classList.remove('warning-sub');
          }

          if (isWarning) {
            infoDiv.innerHTML = `
              <div class="blocked">
                <span class="blocked-icon">⛔</span>
                <div class="blocked-title">${escapeHtml(mainStatus)}</div>
                <div class="blocked-sub">${escapeHtml(subStatus) || 'অনুমতি নেই'}</div>
                <div class="blocked-msg"><i class="fas fa-lock"></i> বিস্তারিত তথ্য দেখা যাবে না</div>
              </div>
            `;
          } else {
            infoDiv.innerHTML = fullHTML;
            setTimeout(() => { overlay.classList.remove('active', 'warning'); }, 800);
          }
        })
        .catch(() => {
          infoDiv.innerHTML = `
            <div class="not-found">
              <i class="fas fa-exclamation-circle"></i>
              <h2>সংযোগ সমস্যা</h2>
              <p>আবার চেষ্টা করুন</p>
            </div>
          `;
          overlay.classList.remove('active', 'warning');
        });
    })();
  </script>
</body>
</html>
